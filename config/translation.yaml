# 번역기 고정. 검증 결과를 보기 전에 기록한다. 2026-08-21.
# 이 파일의 replacement 규칙은 수치를 본 뒤에 고치지 않는다.

seed: 42
temperature: 0.0
max_tokens: 2048

# API 실패 시에만 탄다. 품질 교체 순서와 같다. 바꾸지 않는다.
fallback_order_frozen:
  - cohere/command-a
  - openai/gpt-4.1
  - google/gemini-2.5-flash

# 현재 확정. 평가 풀 OpenAI 3종과 가문 겹침은 알려진 한계.
primary_model: openai/gpt-4.1
fallback_models: []
fallback_chain_closed: true

prompt_file: prompts/translate_instruction.txt
backtranslate_prompt_file: prompts/backtranslate_instruction.txt
prompt_file_by_bucket:
  math: prompts/translate_field.txt
  instruction: prompts/translate_instruction.txt
  extraction: prompts/translate_extraction.txt
  toolcall: prompts/translate_toolcall.txt
  abstention: prompts/translate_toolcall.txt
  coding: prompts/translate_coding.txt
backtranslate_prompt_file_by_bucket:
  math: prompts/backtranslate_field.txt
  instruction: prompts/backtranslate_instruction.txt
  extraction: prompts/backtranslate_extraction.txt
  toolcall: prompts/backtranslate_toolcall.txt
  abstention: prompts/backtranslate_toolcall.txt
  coding: prompts/backtranslate_coding.txt
languages: [ko, hi]
language_names:
  ko: Korean
  hi: Hindi
  en: English

scope_this_run:
  bucket: coding
  n: 14
  field: question_content_head
  note: "서술 헤드만 번역. 예제·제약·starter_code·테스트는 번역기에 넣지 않는다."

cache:
  path: data/translation_cache.jsonl
  key_fields: [qid, field, target_lang, model, prompt_sha256, seed, temperature, n_per_bucket]

# --- 교체 기준 (검증 전 고정). 결과 보고 뒤집지 않는다. ---
replacement:
  forbidden_region:
    rule: "14문항 중 금지 영역 훼손 1건이라도 있으면 즉시 교체 대상"
    fail_if_n_items_ge: 1
    math_forbidden: numeric_literals
    math_forbidden_note: >
      math 의 치명 훼손은 숫자 리터럴이다. 고유명 음차(Janet→재닛)는
      이야기 문제의 서술 번역이며 이 버킷의 즉시 교체 조건이 아니다.
    instruction_forbidden: markdown_bracket_markers
    instruction_markers: ["*", "**", "***", "-", "[", "]", "<<", ">>", "******", "```"]
    instruction_forbidden_note: >
      채택 7종은 마크다운·브래킷 마커로 채점한다. 번역 후에도 문자 그대로.
      kwargs 필드는 번역하지 않는다. json_format 예시의 ``` 도 마커다.
    instruction_also_runs: [quantity_v2, constraint_number]
    instruction_constraint_types:
      - detectable_content:number_placeholders
      - detectable_format:number_bullet_lists
      - detectable_format:number_highlighted_sections
      - length_constraints:number_paragraphs
    instruction_constraint_note: >
      kwargs 수치 중 영어 프롬프트에 있는 값이 번역에서 사라지면 문항 무효.
      마커 훼손과 동급. math 수량 드롭(오답)과 다르다.
    extraction_forbidden: gold_literals_dates_numbers_units_schema_keys
    extraction_note: >
      고유명·식별자·날짜·ISO·숫자·단위(1280 g, 23 C)는 본문에 문자 그대로.
      범주형 값(부서, 직함, 색, 트랙, 모듈, site)은 영어 스키마 enum.
      스키마 키와 enum 토큰은 번역 대상 밖. 걸린 문항만 고치지 않고 14문항에 균일 적용.
      extraction 은 교체 풀 없음. 수정 후 잔여는 n 축소. 새 문항 금지.
    extraction_replacement_cap: 5
    toolcall_forbidden: schema_bytes_and_utterance_answer_literals
    toolcall_note: >
      발화만 번역. 스키마는 번역기에 미전달. 스키마 바이트 동일.
      possible_answer 값이 영어 발화에 있으면 보존. 고유명은 extraction B.
      평범한 단어가 정답 리터럴인 문항은 교체하지 않음 (숫자만 남는 편향).
      ordinary-only miss 는 leftover. identifier/number/proper_name/schema 만
      재번역 후 같은 유형 대체, cap 5.
    toolcall_replacement_cap: 5
    abstention_forbidden: schema_bytes_and_utterance_dates_units
    abstention_note: >
      발화만 번역. 스키마는 번역기에 미전달. 실제 함수명·파라미터명·enum을
      프롬프트에 넣지 않는다 (측정하려는 실패 모드를 은폐함).
      정답은 툴 미호출. 번역이 스키마와 더 가까워지면 안 된다.
      원문 발화에 없던 함수명·파라미터명·enum 문자열이 번역본에만 있으면
      schema_proximity_leak. ko/hi 따로 집계. 맞추지 않고 건수만 보고.
      교체·재번역 트리거가 아님. 한쪽만 생기면 언어 간 난이도가 달라진 관측.
      schema_bytes / date / unit 만 재번역 후 대체, cap 5.
    abstention_replacement_cap: 5
    abstention_schema_proximity_leak: report_do_not_fix
    coding_forbidden: starter_tail_placeholders_markers_structure_print_tokens
    coding_note: >
      question_content 헤드(서술)만 번역. 테일(Example/Input/Constraints/samples),
      starter_code, 테스트는 번역기에 미전달. 수식·식별자·Yes/No 는 플레이스홀더.
      코드 마커(백틱/펜스)와 예제 구조 헤더는 instruction 마커와 동급.
      정답은 코드 실행. 테스트 출력 토큰이 서술에도 있으면 보존(실행 바이트).
      extraction/toolcall 의 ordinary_gold 문자열 채점과 다름. 그 차이를 기록.
      identifier_digit_leak / ordinal / count 는 leftover. schema/placeholder 등만
      재번역 후 같은 난이도 대체, cap 5.
    coding_replacement_cap: 5
  backtranslation_asymmetry:
    rule: "역번역 의미 이탈 플래그가 ko 와 hi 에서 비대칭이면 교체 검토"
    note: >
      양쪽이 비슷하게 나쁘면 번역기/역번역기 문제일 수 있다.
      한쪽만 나쁘면 파이프라인(템플릿·언어 처리) 설계 실패로 본다.
    flag_if_numeric_mismatch: true
    flag_if_marker_mismatch: true
    flag_if_chrfpp_lt: 0.50
    asymmetric_if_abs_flag_count_diff_ge: 3
    asymmetric_if_one_side_zero_and_other_ge: 2

