verification:
  chrfpp_word_order: 2
  length_tokenizer: tiktoken_cl100k_base
  length_tokenizer_note: >
    참고용. 파일럿 본실행 후에는 실제 API usage 토큰으로 다시 계산한다.
    tiktoken 값은 보존만 한다.
  benchmax:
    hub: LLaMAX/BenchMAX_Math
    license: cc-by-4.0
    use_as_data: false
    compare_lang: ko
    report_mismatch_rate: true
    n_examples: 3
